<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="index.title">किसान द्वार — KISAN DWAAR</title>
<link rel="stylesheet" href="css/kisan.css">
</head>
<body>
  <header class="site-header">
    <h1 class="hi" data-i18n="index.h1">किसान द्वार</h1>
    <span class="badge hi" data-i18n="common.badge_rules">🔒 नियम-आधारित · कोई AI मॉडल नहीं</span>
  </header>
  <div id="site-nav"></div>

  <main class="container">
    <div id="chat" class="chat" role="log" aria-live="polite" aria-label="बातचीत" data-i18n-aria-label="index.chat_aria_label"></div>

    <div class="chips">
      <button id="discover-btn" type="button" class="button hi">सभी योजनाएं देखें</button>
    </div>

    <form id="composer" class="composer">
      <label for="query-input" class="hi" style="position:absolute;left:-9999px;">अपना सवाल टाइप करें</label>
      <input id="query-input" class="hi" type="text" placeholder="अपना सवाल टाइप करें…">
      <button type="submit" class="button hi">भेजें</button>
    </form>

    <div id="disclosure-panel"></div>
  </main>

  <footer class="site-footer">
    <p class="hi disclosure" data-i18n="common.footer_disclosure">प्रस्ताव प्रोटोटाइप — YoDevStudio</p>
    <div id="site-footer-links"></div>
  </footer>

  <div id="print-area" class="print-only"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { renderNav, renderFooterStaffLink } from './js/nav.js';
    import { renderDisclosurePanel } from './js/disclosure.js';
    import { applyTranslations } from './js/i18n.js';
    renderNav();
    renderFooterStaffLink();
    renderDisclosurePanel();
    applyTranslations();
  </script>
</body>
</html>
