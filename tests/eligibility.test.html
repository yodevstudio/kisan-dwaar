  <h1>Eligibility engine — test harness</h1>
  <p>eligibility.js · assemble.js · normalise.js · router.js · amount-policy.js · explainer.js — unit tests run against synthetic fixtures; a separate pass at the bottom runs every real <code>data/schemes.json</code> record through the engine as a regression check.</p>
  <div id="summary">Running…</div>
  <ul id="results"></ul>

<script type="module">
import { evaluate, evaluateAll } from '../js/eligibility.js';
import {
  assemble,
  assertNoUnsourcedNumber,
  explainGap,
  findNearMissGap,
} from '../js/assemble.js';
import { normalise } from '../js/normalise.js';
import { route } from '../js/router.js';
import { findAmountPolicyViolations } from '../js/amount-policy.js';
import { explain, assertDerivedFromSourced } from '../js/explainer.js';

const results = [];

async function test(name, fn) {
  try {
    await fn();
    results.push({ name, pass: true });
  } catch (err) {
    results.push({ name, pass: false, error: err.message });
  }
}

function assertEqual(actual, expected, msg) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${msg || 'assertEqual'}: expected ${e}, got ${a}`);
}

function assertTrue(cond, msg) {
  if (!cond) throw new Error(msg || 'assertTrue failed');
}

function assertThrows(fn, msg) {
  try {
    fn();
  } catch (e) {
    return;
  }
  throw new Error(msg || 'expected function to throw');
}

// ===== eligibility.js =====

await test('evaluate: all_of satisfied -> ELIGIBLE', () => {
  const scheme = { eligibility: { all_of: [{ slot: 'age', op: 'gte', value: 18 }], any_of: [], none_of: [] } };
  assertEqual(evaluate({ age: 25 }, scheme).verdict, 'ELIGIBLE');
});

await test('evaluate: missing slot -> NEED_MORE_INFO, names the missing slot', () => {
  const scheme = { eligibility: { all_of: [{ slot: 'age', op: 'gte', value: 18 }], any_of: [], none_of: [] } };
  const r = evaluate({}, scheme);
  assertEqual(r.verdict, 'NEED_MORE_INFO');
  assertEqual(r.missing_slots, ['age']);
});

await test('evaluate: failed condition -> NOT_ELIGIBLE', () => {
  const scheme = { eligibility: { all_of: [{ slot: 'age', op: 'gte', value: 18 }], any_of: [], none_of: [] } };
  assertEqual(evaluate({ age: 10 }, scheme).verdict, 'NOT_ELIGIBLE');
});

await test('evaluate: none_of exclusion blocks eligibility', () => {
  const scheme = { eligibility: { all_of: [], any_of: [], none_of: [{ slot: 'category', op: 'in', value: ['APL'] }] } };
  assertEqual(evaluate({ category: 'APL' }, scheme).verdict, 'NOT_ELIGIBLE');
});

await test('evaluate: wildcard (*) condition is always satisfied', () => {
  const scheme = { eligibility: { all_of: [{ slot: 'gender', op: 'eq', value: '*' }], any_of: [], none_of: [] } };
  assertEqual(evaluate({}, scheme).verdict, 'ELIGIBLE');
});

await test('evaluate: a range slot straddling a threshold is unknown, never guessed', () => {
  const scheme = { eligibility: { all_of: [{ slot: 'age', op: 'gte', value: 60 }], any_of: [], none_of: [] } };
  assertEqual(evaluate({ age: { min: 55, max: 74 } }, scheme).verdict, 'NEED_MORE_INFO');
});

await test('evaluate: gender-dependent age thresholds via any_of branch groups', () => {
  const scheme = {
    eligibility: {
      all_of: [],
      any_of: [
        [{ slot: 'gender', op: 'eq', value: 'female' }, { slot: 'age', op: 'gte', value: 55 }],
        [{ slot: 'gender', op: 'eq', value: 'male' }, { slot: 'age', op: 'gte', value: 58 }],
      ],
      none_of: [],
    },
  };
  assertEqual(evaluate({ gender: 'female', age: 56 }, scheme).verdict, 'ELIGIBLE');
  assertEqual(evaluate({ gender: 'male', age: 56 }, scheme).verdict, 'NOT_ELIGIBLE');
});

await test('evaluateAll: batches evaluate() across a scheme list', () => {
  const schemes = [
    { scheme_id: 'A', eligibility: { all_of: [{ slot: 'age', op: 'gte', value: 18 }], any_of: [], none_of: [] } },
    { scheme_id: 'B', eligibility: { all_of: [{ slot: 'age', op: 'lte', value: 10 }], any_of: [], none_of: [] } },
  ];
  const out = evaluateAll({ age: 25 }, schemes);
  assertEqual(out.map((r) => r.evaluation.verdict), ['ELIGIBLE', 'NOT_ELIGIBLE']);
});

// ===== normalise.js (against the real, ported data/lexicon.json) =====

await test('normalise: dialect phrase maps to standard Hindi', async () => {
  const lexicon = await (await fetch('../data/lexicon.json')).json();
  const out = normalise('बुढ़ापा री पिंडोळी चाहिए', lexicon);
  assertTrue(out.normalised.includes('वृद्धावस्था पेंशन'), `got: ${out.normalised}`);
});

await test('normalise: longest matching key wins over a shorter key it contains', async () => {
  const lexicon = await (await fetch('../data/lexicon.json')).json();
  const out = normalise('तारबंदी चाहिए', lexicon);
  assertTrue(out.normalised.includes('तारबंदी योजना'), `got: ${out.normalised}`);
});

// ===== router.js =====

const testSchemes = [
  { scheme_id: 'RJ_TARBANDI', name_hi: 'तारबंदी योजना', keywords_hi: ['तारबंदी', 'फेंसिंग'] },
  { scheme_id: 'RJ_KCC', name_hi: 'किसान क्रेडिट कार्ड', keywords_hi: ['ऋण', 'लोन'] },
];

await test('route: named scheme match returns a single confident scheme_id', () => {
  const r = route('मुझे तारबंदी योजना चाहिए', testSchemes);
  assertEqual(r.intent, 'scheme_query');
  assertEqual(r.scheme_ids, ['RJ_TARBANDI']);
});

await test('route: a discovery phrase with no confident match returns discover intent', () => {
  const r = route('मेरे लायक कोई योजना बताओ', testSchemes);
  assertEqual(r.intent, 'discover');
});

await test('route: a named scheme wins over an embedded discovery phrase', () => {
  const r = route('तारबंदी के बारे में क्या मिल सकता है', testSchemes);
  assertEqual(r.intent, 'scheme_query');
  assertEqual(r.scheme_ids, ['RJ_TARBANDI']);
});

await test('route: unmatched text returns unknown with zero confidence', () => {
  const r = route('आज मौसम कैसा है', testSchemes);
  assertEqual(r.intent, 'unknown');
  assertEqual(r.confidence, 0);
});

await test('route: extracts age, gender and district slots from free text', () => {
  const r = route('मैं 45 साल की महिला हूं, जयपुर में रहती हूं', []);
  assertEqual(r.slots.age, 45);
  assertEqual(r.slots.gender, 'female');
  assertEqual(r.slots.district, 'जयपुर');
});

// ===== assemble.js =====

await test('assemble: ELIGIBLE verdict fills the template with sourced benefit text', () => {
  const scheme = {
    scheme_id: 'RJ_TEST_01',
    name_hi: 'परीक्षण योजना',
    source_url: 'https://example.gov.in/test',
    last_verified: '2026-01-01',
    benefit: { amount_inr: null, amount_text_hi: 'निःशुल्क बीज उपलब्ध' },
    documents: ['जमाबंदी'],
    response_templates_hi: { eligible: '{{scheme_name_hi}} — {{benefit_text}}' },
    eligibility: { all_of: [], any_of: [], none_of: [] },
  };
  const out = assemble('ELIGIBLE', scheme, evaluate({}, scheme));
  assertTrue(out.text_hi.includes('निःशुल्क बीज उपलब्ध'), `got: ${out.text_hi}`);
  assertTrue(out.text_hi.includes('परीक्षण योजना'), `got: ${out.text_hi}`);
});

await test('assemble: NEED_MORE_INFO names the missing slot in Hindi, not raw snake_case', () => {
  const scheme = {
    scheme_id: 'RJ_TEST_02',
    name_hi: 'परीक्षण योजना',
    source_url: 'https://example.gov.in/test',
    response_templates_hi: { need_info: '{{scheme_name_hi}}: {{missing}}' },
    eligibility: { all_of: [{ slot: 'age', op: 'gte', value: 18 }], any_of: [], none_of: [] },
  };
  const out = assemble('NEED_MORE_INFO', scheme, evaluate({}, scheme));
  assertTrue(out.text_hi.includes('आयु'), `got: ${out.text_hi}`);
  assertTrue(!out.text_hi.includes('age'), `raw slot id leaked: ${out.text_hi}`);
});

await test('assertNoUnsourcedNumber: throws on a figure absent from the allowlist (guard-throw)', () => {
  const scheme = { scheme_id: 'RJ_TEST_03', name_hi: 'परीक्षण', benefit: { amount_inr: 5000 }, eligibility: {} };
  assertThrows(() => assertNoUnsourcedNumber({ text_hi: 'आपको ₹99999 मिलेगा', speech_hi: '' }, scheme));
});

await test('assertNoUnsourcedNumber: passes when every figure is on the allowlist', () => {
  const scheme = { scheme_id: 'RJ_TEST_04', name_hi: 'परीक्षण', benefit: { amount_inr: 5000 }, eligibility: {} };
  assertTrue(assertNoUnsourcedNumber({ text_hi: 'आपको ₹5000 मिलेगा', speech_hi: '' }, scheme));
});

await test('explainGap: age shortfall phrased as "eligible at", every digit traceable', () => {
  const scheme = {
    scheme_id: 'RJ_TEST_05',
    name_hi: 'परीक्षण',
    benefit: {},
    eligibility: { all_of: [{ slot: 'age', op: 'gte', value: 60 }], any_of: [], none_of: [] },
  };
  const evaluation = evaluate({ age: 50 }, scheme);
  const sentence = explainGap(evaluation.gaps[0], scheme);
  assertTrue(sentence.includes('50') && sentence.includes('60'), `got: ${sentence}`);
});

await test('findNearMissGap: identifies the single gap that would flip the verdict', () => {
  const scheme = {
    scheme_id: 'RJ_TEST_06',
    eligibility: {
      all_of: [{ slot: 'age', op: 'gte', value: 60 }, { slot: 'category', op: 'in', value: ['BPL'] }],
      any_of: [],
      none_of: [],
    },
  };
  const slots = { age: 55, category: 'BPL' };
  const gap = findNearMissGap(slots, scheme, evaluate(slots, scheme));
  assertTrue(gap && gap.slot === 'age', `got: ${JSON.stringify(gap)}`);
});

// ===== amount-policy.js =====

await test('findAmountPolicyViolations: flags a rupee figure with no rate_policy', () => {
  const schemes = [{ scheme_id: 'RJ_BAD', benefit: { amount_inr: null, amount_text_hi: 'लगभग रु. 5000 तक अनुदान' } }];
  assertEqual(findAmountPolicyViolations(schemes), ['RJ_BAD']);
});

await test('findAmountPolicyViolations: a stated rate_policy clears the same figure', () => {
  const schemes = [{
    scheme_id: 'RJ_OK',
    benefit: { amount_inr: null, amount_text_hi: 'लगभग रु. 5000 तक अनुदान', rate_policy: 'RATE_VARIES_BY_DISTRICT' },

// ===== explainer.js =====
// Fixture matches docs/DATA_SPEC.md §3.3's worked pipeline example exactly,
// so the numbers here can be checked against that document by eye.

const pipelineScheme = {
  scheme_id: 'RJ_IRRIGATION_PIPELINE',
  subsidy_rule: {
    rule_id: 'PIPELINE_HDPE_PVC',
    applies_when: [{ slot: 'pipe_diameter_mm', op: 'gte', value: 63 }],
    inputs: [
      { slot: 'pipe_material', type: 'single', options: ['hdpe', 'pvc'], required: true, prompt_hi: 'पाइप किस चीज़ का है?' },
      { slot: 'pipe_metres', type: 'number', unit_hi: 'मीटर', required: true, prompt_hi: 'कितने मीटर पाइप चाहिए?' },
      { slot: 'quoted_cost_inr', type: 'number', unit_hi: 'रुपये', required: false, prompt_hi: 'डीलर का कोटेशन कितने का है? (न हो तो छोड़ दें)' },
    ],
    unit_caps: { pipe_metres: { max: 800, label_hi: 'अधिकतम 800 मीटर तक अनुदान देय' } },
    terms: [
      {
        id: 'pct', label_hi: 'इकाई लागत का 50%', type: 'percent_of_cost', percent: 50,
        cost_basis: { kind: 'citizen_quotation', slot: 'quoted_cost_inr' },
      },
      {
        id: 'cap', label_hi: 'अधिकतम दर सीमा', type: 'per_unit_cap',
        rates: { hdpe: 50, pvc: 35 }, rate_selector_slot: 'pipe_material', unit_slot: 'pipe_metres', unit_hi: 'प्रति मीटर',
      },
    ],
    combine: 'min',
    on_missing_input: 'report_computable_terms_only',
    source_quote_hi: '63 मि.मी. या इससे अधिक व्यास के पाइप खरीदने पर इकाई लागत का 50 प्रतिशत या अधिकतम रू. 50/प्रति मीटर एचडीपीई पाईप पर या रू. 35/प्रति मीटर पीवीसी पाईप पर, जो भी आनुपातिक रुप से कम हो, अनुदान देय है।',
    source_url: 'https://rajkisan.rajasthan.gov.in/WebsiteNew/pipeline.html',
    last_verified: '2026-08-22',
  },
};

await test('explain: pipeline case with a quotation matches the worked example exactly (₹30,000 via the cap)', () => {
  const slots = { pipe_diameter_mm: 75, pipe_material: 'hdpe', pipe_metres: 600, quoted_cost_inr: 90000 };
  const out = explain(pipelineScheme, slots);
  assertEqual(out.status, 'OK');
  assertEqual(out.terms.find((t) => t.id === 'pct').value.value, 45000);
  assertEqual(out.terms.find((t) => t.id === 'cap').value.value, 30000);
  assertEqual(out.result.value, 30000);
  assertTrue(assertDerivedFromSourced(out, pipelineScheme, slots));
});

await test('explain: same case without a quotation reports ₹30,000 as an upper bound, not a false-precision result', () => {
  const slots = { pipe_diameter_mm: 75, pipe_material: 'hdpe', pipe_metres: 600 };
  const out = explain(pipelineScheme, slots);
  assertEqual(out.status, 'PARTIAL');
  assertEqual(out.result, null);
  assertEqual(out.bound.type, 'upper');
  assertEqual(out.bound.value.value, 30000);
  assertEqual(out.missing_slots, ['quoted_cost_inr']);
  assertTrue(assertDerivedFromSourced(out, pipelineScheme, slots));
});

await test('explain: a unit_caps ceiling binds when the citizen states more than the cap', () => {
  const slots = { pipe_diameter_mm: 75, pipe_material: 'hdpe', pipe_metres: 1000, quoted_cost_inr: 90000 };
  const out = explain(pipelineScheme, slots);
  // pipe_metres capped at 800 before the per-metre term reads it: 50 * 800 = 40000
  assertEqual(out.terms.find((t) => t.id === 'cap').value.value, 40000);
  assertTrue(assertDerivedFromSourced(out, pipelineScheme, slots));
});

await test('explain: applies_when unsatisfied reports NOT_APPLICABLE, never a figure', () => {
  const out = explain(pipelineScheme, { pipe_diameter_mm: 40, pipe_material: 'hdpe', pipe_metres: 600, quoted_cost_inr: 90000 });
  assertEqual(out.status, 'NOT_APPLICABLE');
  assertEqual(out.result, null);
});

await test('explain: a scheme with no subsidy_rule reports NO_RULE', () => {
  const out = explain({ scheme_id: 'RJ_NO_RULE' }, {});
  assertEqual(out.status, 'NO_RULE');
});

// The three guard-throws — one per provenance kind, each independently
// caught. A number surviving here would mean a citizen could be shown a
// figure the scheme record and the citizen's own answers don't actually
// support.
await test('assertDerivedFromSourced: throws when a "rule" node is corrupted (guard-throw 1 of 3)', () => {
  const slots = { pipe_diameter_mm: 75, pipe_material: 'hdpe', pipe_metres: 600, quoted_cost_inr: 90000 };
  const out = explain(pipelineScheme, slots);
  const corrupted = JSON.parse(JSON.stringify(out));
  corrupted.terms.find((t) => t.id === 'cap').value.from.operands[0].value = 999; // claims a rate the rule never published
  assertThrows(() => assertDerivedFromSourced(corrupted, pipelineScheme, slots));
});

await test('assertDerivedFromSourced: throws when an "input" node is corrupted (guard-throw 2 of 3)', () => {
  const slots = { pipe_diameter_mm: 75, pipe_material: 'hdpe', pipe_metres: 600, quoted_cost_inr: 90000 };
  const out = explain(pipelineScheme, slots);
  const corrupted = JSON.parse(JSON.stringify(out));
  corrupted.terms.find((t) => t.id === 'pct').value.from.operands[1].value = 500000; // claims a quotation the citizen never gave
  assertThrows(() => assertDerivedFromSourced(corrupted, pipelineScheme, slots));
});

await test('assertDerivedFromSourced: throws when a "derived" (corrupted-final-value) node is corrupted (guard-throw 3 of 3)', () => {
  const slots = { pipe_diameter_mm: 75, pipe_material: 'hdpe', pipe_metres: 600, quoted_cost_inr: 90000 };
  const out = explain(pipelineScheme, slots);
  const corrupted = JSON.parse(JSON.stringify(out));
  corrupted.result.value = 25000; // the ₹30,000 result, restated as a different figure
  assertThrows(() => assertDerivedFromSourced(corrupted, pipelineScheme, slots));
});

// ===== explainer.js against the two live subsidy_rule records =====
// data/schemes.json now carries real, human-verified subsidy_rule blocks
// for RJ_TARBANDI and RJ_DRIP_SPRINKLER (verified 2026-08-22). These fetch

await test('explain: RJ_TARBANDI (real record) — 50% of cost, capped at ₹40,000', async () => {

  assertEqual(out.result.value, 25000); // min(25000, 40000) — the percent term binds here

await test('explain: RJ_TARBANDI (real record) — the flat cap binds when cost is high', async () => {

await test('explain: RJ_DRIP_SPRINKLER (real record) — "small"/"marginal" selects 70%', async () => {

  const scheme = schemes.find((s) => s.scheme_id === 'RJ_DRIP_SPRINKLER');

await test('explain: RJ_DRIP_SPRINKLER (real record) — missing quotation reports PARTIAL, not a guessed figure', async () => {
  const schemes = await (await fetch('../data/schemes.json')).json();
  const scheme = schemes.find((s) => s.scheme_id === 'RJ_DRIP_SPRINKLER');

// ===== regression: every real data/schemes.json record =====
// Not a re-check of scheme content (that's tools/validate-data.mjs's job)
// — this only proves the engine doesn't throw on any real record, for any
// of a few representative citizen profiles, and that assemble() never
// trips its own guard against real data.

await test('regression: every data/schemes.json record evaluates and assembles cleanly for several profiles', async () => {
  const schemes = await (await fetch('../data/schemes.json')).json();
  assertTrue(schemes.length > 0, 'data/schemes.json has no records');

  const profiles = [
    {},
    { occupation: 'farmer', age: 40, gender: 'male', landholding_hectares: { min: 1.01, max: 2 } },
    { occupation: 'farmer', age: 60, gender: 'female', landholding_category: 'small', has_regular_income_source: false },
  ];

  for (const scheme of schemes) {
    for (const slots of profiles) {
      const evaluation = evaluate(slots, scheme);
      assertTrue(['ELIGIBLE', 'NOT_ELIGIBLE', 'NEED_MORE_INFO'].includes(evaluation.verdict), `${scheme.scheme_id}: bad verdict ${evaluation.verdict}`);
      assemble(evaluation.verdict, scheme, evaluation); // throws via assertNoUnsourcedNumber if any figure is unsourced
      const explanation = explain(scheme, slots);
      assertTrue(['NO_RULE', 'NOT_APPLICABLE', 'NEED_MORE_INFO', 'PARTIAL', 'OK'].includes(explanation.status), `${scheme.scheme_id}: bad explainer status ${explanation.status}`);
      assertDerivedFromSourced(explanation, scheme, slots);
    }
  }
});

// ===== render =====

const list = document.getElementById('results');
for (const r of results) {
  const li = document.createElement('li');
  li.className = r.pass ? 'pass' : 'fail';
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = r.pass ? 'PASS' : 'FAIL';
  li.appendChild(label);
  li.appendChild(document.createTextNode(' — ' + r.name));
  if (!r.pass) {
    const err = document.createElement('span');
    err.className = 'error';
    err.textContent = r.error;
    li.appendChild(err);
  }
  list.appendChild(li);
}

const failed = results.filter((r) => !r.pass).length;
const summary = document.getElementById('summary');
summary.textContent = `${results.length - failed} / ${results.length} passed`;
summary.className = failed === 0 ? 'pass' : 'fail';
</script>
</body>
</html>
